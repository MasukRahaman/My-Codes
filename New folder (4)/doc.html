<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #222;
            color: white;
        }

        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #333;
            padding: 15px 30px;
        }

        .nav_links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .nav_links li {
            position: relative;
        }

        .nav_links a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            padding: 12px 18px;
            transition: 0.3s;
        }

        .nav_links a:hover {
            background: #ff7700;
            border-radius: 5px;
        }

        .drop_content {
            position: absolute;
            background: white;
            display: none;
            min-width: 160px;
            top: 30px;
            left: 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        .drop_content a {
            display: block;
            color: black;
            padding: 10px 15px;
            text-decoration: none;
            transition: 0.3s;
        }
        .drop_content a:hover{
            background: #ff7700;
            color: white;
        }
        .nav_links li:hover .drop_content{
            display: block;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <ul class="nav_links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li class="dropdown"><a href="#">Services</a>
                <div class="drop_content">
                    <a href="#">Web Design</a>
                    <a href="#">SEO</a>
                    <a href="#">Marketing</a>
                </div>
            </li>
            <li><a href="#">Content</a></li>
        </ul>
    </nav>
</body>

</html>
