<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Effect</title>
    <style>
        .btn{
            display: flex;
            justify-content: center;
        }
        
        button {
            padding: 10px 20px;
            font-size: 18px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        button:hover {
            transform: scale(1.2); /* Grow effect */
            background: #ff7700;
        }

        button:active {
            transform: scale(0.9); /* Shrink effect when clicked */
        }
    </style>
</head>
<body>
    <div class="btn">
        <button>Hardcore</button>
    </div>
</body>
</html>
