        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .nav {
            display: flex;
            justify-items: center;
            align-items: center;
            gap: 300px;
            height: 150px;
            box-shadow: 2px 0px 1px rgb(101, 95, 106);
            border: 2px solid aliceblue;
            width: 100vw;
            background-color: rgb(255, 255, 255);
        }
        .navbar{
            position: sticky;
            top: 0px;
            z-index: 100;
        }
        nav ul a {
            text-decoration: none;
        }

        nav ul a li {
            display: inline;
            list-style: none;
            color: black;
            padding: 10px;
            align-items: center;    
        }

        nav ul{
            margin-left: 48px;
        }
        nav .logo .img {
            display: inline;
            text-decoration: none;
            color: black;
            font-size: 25px;
            position: relative;
            right: 110px;
        }

        .type {
            font-size: 35px;
            padding: 25px;
            margin-left: 32px;
        }

        .container {
            border: 2px solid rgb(255, 255, 255);
            height: auto;
            width: 75vw;
            float: right;
            display: flex;
            justify-content: space-evenly;
            flex-wrap: wrap;
            row-gap: 10px;
        }

        .box {
            height: 300px;
            width: 260px;
            background-color: aquamarine;
        }

        .box:hover{
            background-color: bisque;
        }
        .pera {
            display: flex;
            justify-content: flex-end;
            gap: 70px;
            padding: 20px;
            font-size: 18px;
        }

        .sps .icon {
            margin: 0 15px;
        }

        .sidebar{
            display: flex;
            flex-direction: column;
            margin-left: 42px;
            float: left;
        }
        .sidebar p{
            padding: 17px;
        }

    </style>
</head>
